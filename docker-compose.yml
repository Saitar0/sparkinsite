version: "3.9"

services:
  sparkinsite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparkinsite
    restart: unless-stopped
    ports:
      - "27016:80" # upstream local da porta do host para o NPM
    volumes:
      - /home/saitaro/sparkinsite/media:/usr/share/nginx/html/media
    environment:
      - TZ=America/Sao_Paulo